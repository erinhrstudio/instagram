name: Caroselli in coda

on:
  schedule:
    # dal 22/10 un giorno alle 12 e uno alle 18 ora italiana (reels/coda.py decide l'ora e il giorno).
    # Ora legale: 12 = 10 UTC, 18 = 16 UTC; ora solare (dal 26/10): 12 = 11 UTC, 18 = 17 UTC.
    # GitHub spesso parte in ritardo o salta un giro: più tentativi, coda.py non pubblica mai due volte.
    - cron: "5 10 * * *"
    - cron: "5 11 * * *"
    - cron: "40 11 * * *"
    - cron: "5 16 * * *"
    - cron: "30 16 * * *"
    - cron: "5 17 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reel
  cancel-in-progress: false

jobs:
  coda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Aggiorna lo stato (un'altra esecuzione può aver appena pubblicato)
        run: git pull -q origin main
      - name: Scegli il post di oggi
        id: coda
        run: python -m reels.coda
      - name: Pubblica il post (carosello o Reel, a giorni alterni)
        if: steps.coda.outputs.name != ''
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python -m reels.post "${{ steps.coda.outputs.name }}" --publish ${{ steps.coda.outputs.reel }}
      - name: Registra il post pubblicato
        if: steps.coda.outputs.name != ''
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state/published.json
          if ! git diff --cached --quiet; then
            git commit -m "Pubblicato il post ${{ steps.coda.outputs.name }}"
            git pull --rebase -q origin main && git push
          fi
