name: "TikTok: collega account"

on:
  workflow_dispatch:
    inputs:
      authorization_code:
        description: "Codice mostrato dalla pagina tiktok.html (vale pochi minuti e una volta sola)"
        required: true
        type: string

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Scambia il codice e salva il collegamento
        shell: bash
        env:
          # accetta sia le chiavi sandbox sia quelle definitive
          CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY_SANDBOX || secrets.TIKTOK_CLIENT_KEY }}
          CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET_SANDBOX || secrets.TIKTOK_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REDIRECT_URI: https://erinhrstudio.github.io/instagram/tiktok.html
        run: |
          set -euo pipefail
          # il codice si legge dall'evento, così non compare nei log (il repo è pubblico)
          AUTH_CODE=$(jq -r '.inputs.authorization_code' "$GITHUB_EVENT_PATH" | tr -d '[:space:]')
          echo "::add-mask::$AUTH_CODE"
          if [ -z "$CLIENT_KEY" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Mancano i secrets TIKTOK_CLIENT_KEY / TIKTOK_CLIENT_SECRET (o le versioni _SANDBOX)."
            exit 1
          fi
          curl -sS -X POST 'https://open.tiktokapis.com/v2/oauth/token/' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_key=${CLIENT_KEY}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "code=${AUTH_CODE}" \
            --data-urlencode 'grant_type=authorization_code' \
            --data-urlencode "redirect_uri=${REDIRECT_URI}" \
            -o /tmp/t.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/t.json"))
          for k in ("access_token", "refresh_token"):
              if d.get(k):
                  print(f"::add-mask::{d[k]}")
          if not d.get("refresh_token"):
              err, desc = d.get("error", "sconosciuto"), d.get("error_description", "")
              hint = {
                  "invalid_client": "Client key o secret sbagliati: in Sandbox TikTok dà chiavi diverse da quelle dell'app definitiva.",
                  "invalid_grant": "Codice scaduto o già usato: rifai l'autorizzazione e lancia subito il workflow.",
              }.get(err, "")
              print(f"::error::Collegamento fallito: {err} {desc} {hint}")
              sys.exit(1)
          print("Autorizzazione riuscita. Permessi:", d.get("scope", ""))
          open("/tmp/refresh", "w").write(d["refresh_token"])
          open("/tmp/openid", "w").write(d.get("open_id", ""))
          PY
          rm -f /tmp/t.json
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Autorizzazione riuscita ma manca il secret GH_PAT, quindi non posso salvare il collegamento."
            exit 1
          fi
          gh secret set TIKTOK_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < /tmp/refresh
          gh secret set TIKTOK_OPEN_ID --repo "$GITHUB_REPOSITORY" < /tmp/openid
          rm -f /tmp/refresh /tmp/openid
          echo "Collegamento salvato nei secrets TIKTOK_REFRESH_TOKEN e TIKTOK_OPEN_ID."
