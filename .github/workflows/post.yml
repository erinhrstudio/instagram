name: Pubblica post pronto

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Cartella in posts/ (es. strokes-casablancas)"
        required: true
      publish:
        description: "Pubblica davvero su Instagram (altrimenti prova: Instagram controlla i file ma non pubblica nulla)"
        type: boolean
        default: false
      reel:
        description: "Pubblica come Reel verticale (media/instagram/<nome>.mp4, altrimenti media/tiktok) invece che come carosello"
        type: boolean
        default: false
      trial:
        description: "Solo Reel: Trial Reel visto prima solo dai non follower (SS_PERFORMANCE = Instagram lo allarga da solo se va bene, MANUAL = decidi tu dall'app)"
        type: choice
        options: ["no", "SS_PERFORMANCE", "MANUAL"]
        default: "no"

permissions:
  contents: write

concurrency:
  group: reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: Pubblica il carosello
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          NAME: ${{ inputs.name }}
        run: |
          ARGS="--check"
          [ "${{ inputs.publish }}" = "true" ] && ARGS="--publish"
          [ "${{ inputs.reel }}" = "true" ] && ARGS="$ARGS --reel"
          [ "${{ inputs.trial }}" != "no" ] && [ -n "${{ inputs.trial }}" ] && ARGS="$ARGS --trial ${{ inputs.trial }}"
          python -m reels.post "$NAME" $ARGS
      - name: Registra il post pubblicato
        if: inputs.publish
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state/published.json
          if ! git diff --cached --quiet; then
            git commit -m "Pubblicato il post ${{ inputs.name }}"
            git pull --rebase -q origin main && git push
          fi
