name: "YouTube: carica Shorts programmati"

on:
  workflow_dispatch:
    inputs:
      quanti:
        description: "Quanti video caricare al massimo (la quota giornaliera ne permette circa 6)"
        required: false
        default: "6"
      solo:
        description: "Solo questo post (nome), per una prova"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: youtube
  cancel-in-progress: false

jobs:
  carica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Carica e programma
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          QUANTI: ${{ inputs.quanti }}
          SOLO: ${{ inputs.solo }}
        run: python -m tools.youtube_carica
      - name: Salva lo stato
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state/youtube.json
          if ! git diff --cached --quiet; then
            git commit -m "YouTube: Shorts caricati"
            git pull --rebase -q origin main && git push
          fi
