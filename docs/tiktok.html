<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Collegamento TikTok</title>
<body style="font-family:sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.5">
<h1>Collegamento TikTok</h1>
<p id="msg">Nessun codice ricevuto.</p>
<script>
const p = new URLSearchParams(location.search);
if (p.get("code")) {
  document.getElementById("msg").innerHTML =
    "Copia questo codice e incollalo nel workflow «TikTok: collega account» su GitHub (scade in pochi minuti):" +
    "<pre style='white-space:pre-wrap;word-break:break-all;background:#eee;padding:12px'>" +
    p.get("code").replace(/[<>&]/g, "") + "</pre>";
} else if (p.get("error")) {
  document.getElementById("msg").textContent = "TikTok ha restituito un errore: " + p.get("error");
}
</script>
</body></html>
